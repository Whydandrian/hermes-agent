model:
  default: llama-3.3-70b-versatile
  provider: custom:groq
  allowed_models:
    - llama-3.3-70b-versatile

provider: custom:groq
allowed_providers:
  - custom:groq

# Groq via OpenAI-compatible endpoint (custom provider).
# API key diambil dari env var GROQ_API_KEY (lihat .env.production).
providers:
  groq:
    api: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY

memory:
  memory_enabled: false
  user_profile_enabled: true

timezone: Asia/Makassar

logging:
  level: INFO

platforms:
  whatsapp:
    require_mention: true      # <-- diubah: grup wajib tag/reply, DM tetap bebas
    group_policy: open         # bot boleh dipakai di grup mana pun dia diundang
    dm_policy: open            # DM tetap terbuka untuk semua (sesuai WHATSAPP_ALLOWED_USERS=*)
    reply_prefix: ""
    unauthorized_dm_behavior: ignore   # opsional, kalau suatu saat allowlist tidak lagi "*"
    home_channel_required: false       # <-- DISABLE "No home channel" message
    dedup_window: 5             # <-- Prevent duplicate processing within 5 seconds
    message_timeout: 30         # <-- Timeout untuk message processing (seconds)
    show_welcome_message: false # <-- DISABLE welcome/help message
    show_available_tools: false # <-- DISABLE tools listing

  telegram:
    require_mention: false

platform_toolsets:
  whatsapp: [vision]   # Only vision tool, no skills or terminal

context_files:
  - path: /opt/prompts/system.md
    label: System Prompt
  - path: /opt/knowledges/email/email.md
    label: Email Knowledge Base
  - path: /opt/knowledges/domain/domain.md
    label: Domain Knowledge Base
  - path: /opt/knowledges/helpdesk/helpdesk.md
    label: Helpdesk Knowledge Base
  - path: /opt/knowledges/hosting/hosting.md
    label: Hosting Knowledge Base
  - path: /opt/knowledges/networking/lan.md
    label: LAN Knowledge Base
  - path: /opt/knowledges/networking/wifi.md
    label: WiFi Knowledge Base
  - path: /opt/knowledges/regulation/sop.md
    label: Regulation & SOP Knowledge Base
  - path: /opt/knowledges/web-apps/web-apps.md
    label: Web Apps Knowledge Base
  - path: /opt/knowledges/synced/knowledge-base.md
    label: Knowledge Base API (auto-sync dari helpdesk.itk.ac.id)
  - path: /opt/knowledges/synced/service-catalog.md
    label: Service Catalog API (auto-sync dari helpdesk.itk.ac.id)

gateway:
  trust_recent_files: true
  platforms:
    whatsapp:
      extra:
        allow_admin_from: ["628219710713"]
        user_allowed_commands: ["help", "whoami", "new", "reset"]
        lock_model: true                 # <-- LOCK model, user tidak bisa ubah

context:
  engine: compressor

terminal:
  backend: docker
  docker_image: "nikolaik/python-nodejs:python3.11-nodejs20"
  container_cpu: 1
  container_memory: 1024

approvals:
  mode: manual