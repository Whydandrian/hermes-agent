services:

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes

    restart: unless-stopped

    command: gateway run

    env_file:
      - .env.production

    environment:
      TZ: Asia/Makassar
      HERMES_DASHBOARD: "0"
      HERMES_GATEWAY_NO_SUPERVISE: "0"

    ports:
      - "127.0.0.1:8642:8642"

    volumes:
      # Hermes Data
      - /root/.hermes:/opt/data

      # Config
      - ./config:/opt/config:ro

      # Prompt
      - ./prompts:/opt/prompts:ro

      # Automation
      - ./automations:/opt/automations:ro

      # Knowledge
      - ./knowledges:/opt/knowledges:ro

      # Logs
      - ./logs:/opt/logs

    shm_size: 512m

    mem_limit: 1536m

    cpus: 1.5

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    healthcheck:
      test: ["CMD","curl","-f","http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - ai-network

networks:

  ai-network:
    external: true
